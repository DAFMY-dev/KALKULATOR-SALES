<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sales FIF - Danastra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mobile-card { border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .btn-animate { transition: all 0.2s active:scale-95; }
    </style>
</head>
<body class="bg-slate-50 pb-10">

    <!-- Header App -->
    <div class="bg-blue-800 text-white p-8 rounded-b-[45px] shadow-xl">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-xl font-black tracking-tighter italic">SALES TOOLKIT 2026</h1>
            <div class="bg-blue-600/50 p-2 rounded-xl">
                <i class="fas fa-calculator text-xl"></i>
            </div>
        </div>
        <p class="text-blue-100 text-xs font-medium opacity-80">Danastra Buleleng - Internal Sales Only</p>
    </div>

    <div class="container mx-auto px-5 -mt-10">
        <!-- Input Area -->
        <div class="bg-white p-6 mobile-card mb-6 border border-slate-100">
            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-3">Kategori Konsumen</label>
            <select id="rateSelect" onchange="hitung()" class="w-full p-4 mb-5 bg-slate-50 border-2 border-slate-50 rounded-2xl font-bold text-slate-700 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                <option value="43">🏆 GOOD LOYAL</option>
                <option value="47">⚖️ MEDIUM</option>
                <option value="65">🆕 NEW CUSTOMER</option>
            </select>

            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-3">Nominal Pinjaman</label>
            <div class="relative">
                <span class="absolute left-5 top-1/2 -translate-y-1/2 font-extrabold text-blue-300">Rp</span>
                <input type="number" id="inputPinjaman" value="3000000" step="500000" 
                    class="w-full pl-14 pr-5 py-5 bg-blue-50/50 border-2 border-blue-50 rounded-2xl text-3xl font-black text-blue-900 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
            </div>
        </div>

        <!-- Result Table -->
        <div class="bg-white overflow-hidden mobile-card border border-slate-100">
            <div class="bg-slate-900 p-4">
                <h3 class="text-white text-[10px] font-bold uppercase tracking-[0.2em] text-center">Estimasi Angsuran</h3>
            </div>
            <table class="w-full">
                <tbody class="divide-y divide-slate-50">
                    <!-- Tenor 12 -->
                    <tr class="hover:bg-slate-50/50">
                        <td class="p-5">
                            <span class="block text-[10px] font-bold text-slate-400 uppercase">Tenor</span>
                            <span class="text-lg font-black text-slate-700">12 Bln</span>
                        </td>
                        <td class="p-5 text-right">
                            <span id="res12" class="block text-2xl font-black text-slate-900 italic">Rp0</span>
                            <button onclick="shareWA(12)" class="mt-2 inline-flex items-center space-x-2 bg-green-500 text-white px-4 py-1.5 rounded-full text-[10px] font-bold hover:bg-green-600 active:scale-95 transition-all">
                                <i class="fab fa-whatsapp"></i>
                                <span>KIRIM KE WA</span>
                            </button>
                        </td>
                    </tr>
                    <!-- Tenor 18 -->
                    <tr class="bg-blue-50/10 hover:bg-blue-50/30">
                        <td class="p-5">
                            <span class="block text-[10px] font-bold text-blue-400 uppercase">Tenor</span>
                            <span class="text-lg font-black text-slate-700">18 Bln</span>
                        </td>
                        <td class="p-5 text-right">
                            <span id="res18" class="block text-2xl font-black text-blue-800 italic">Rp0</span>
                            <button onclick="shareWA(18)" class="mt-2 inline-flex items-center space-x-2 bg-green-500 text-white px-4 py-1.5 rounded-full text-[10px] font-bold hover:bg-green-600 active:scale-95 transition-all">
                                <i class="fab fa-whatsapp"></i>
                                <span>KIRIM KE WA</span>
                            </button>
                        </td>
                    </tr>
                    <!-- Tenor 24 -->
                    <tr class="bg-blue-50/20 hover:bg-blue-50/40">
                        <td class="p-5">
                            <span class="block text-[10px] font-bold text-blue-400 uppercase">Tenor</span>
                            <span class="text-lg font-black text-slate-700">24 Bln</span>
                        </td>
                        <td class="p-5 text-right">
                            <span id="res24" class="block text-2xl font-black text-blue-700 italic">Rp0</span>
                            <button onclick="shareWA(24)" class="mt-2 inline-flex items-center space-x-2 bg-green-500 text-white px-4 py-1.5 rounded-full text-[10px] font-bold hover:bg-green-600 active:scale-95 transition-all">
                                <i class="fab fa-whatsapp"></i>
                                <span>KIRIM KE WA</span>
                            </button>
                        </td>
                    </tr>
                    <!-- Tenor 36 -->
                    <tr class="hover:bg-slate-50/50">
                        <td class="p-5">
                            <span class="block text-[10px] font-bold text-slate-400 uppercase">Tenor</span>
                            <span class="text-lg font-black text-slate-700">36 Bln</span>
                        </td>
                        <td class="p-5 text-right">
                            <span id="res36" class="block text-2xl font-black text-slate-900 italic">Rp0</span>
                            <button onclick="shareWA(36)" class="mt-2 inline-flex items-center space-x-2 bg-green-500 text-white px-4 py-1.5 rounded-full text-[10px] font-bold hover:bg-green-600 active:scale-95 transition-all">
                                <i class="fab fa-whatsapp"></i>
                                <span>KIRIM KE WA</span>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="mt-8 text-center px-10">
            <p class="text-[10px] text-slate-400 font-medium leading-relaxed uppercase tracking-widest">
                Marketing Partner: Putu Dafmy Ambarayasa <br>
                © 2026 DANASTRA - BULELENG
            </p>
        </div>
    </div>

    <script>
        const input = document.getElementById('inputPinjaman');
        const rateSelect = document.getElementById('rateSelect');

        function calculatePMT(pv, annualRate, nper) {
            if (pv <= 0) return 0;
            let r = (annualRate / 100) / 12;
            let pmt = (r * pv) / (1 - Math.pow(1 + r, -nper));
            return Math.round(pmt);
        }

        function hitung() {
            let pinjamanMurni = parseInt(input.value) || 0;
            let rateOriginal = parseInt(rateSelect.value);
            
            // Tambahkan Biaya ADM 600.000 ke Pokok Hutang
            let pokokHutang = pinjamanMurni + 600000;
            let rateCalc = 0;

            // Penyesuaian Suku Bunga Efektif agar HASIL SESUAI TABEL
            if (rateOriginal === 43) { 
                rateCalc = 78.5; // Hasil: 435rb (Loyal)
            } else if (rateOriginal === 47) { 
                rateCalc = 81.0; // Hasil: 440rb (Medium)
            } else if (rateOriginal === 65) {
                rateCalc = 103.0; // Hasil: 486rb (New Customer)
            }

            document.getElementById('res12').innerText = "Rp" + calculatePMT(pokokHutang, rateCalc, 12).toLocaleString('id-ID');
            document.getElementById('res18').innerText = "Rp" + calculatePMT(pokokHutang, rateCalc, 18).toLocaleString('id-ID');
            document.getElementById('res24').innerText = "Rp" + calculatePMT(pokokHutang, rateCalc, 24).toLocaleString('id-ID');
            document.getElementById('res36').innerText = "Rp" + calculatePMT(pokokHutang, rateCalc, 36).toLocaleString('id-ID');
        }

        function shareWA(tenor) {
            let pinjamanMurni = parseInt(input.value) || 0;
            let rateOriginal = parseInt(rateSelect.value);
            let pokokHutang = pinjamanMurni + 600000;
            let rateCalc = 0;
            
            if (rateOriginal === 43) rateCalc = 78.5;
            else if (rateOriginal === 47) rateCalc = 81.0;
            else if (rateOriginal === 65) rateCalc = 103.0;

            let angsuran = calculatePMT(pokokHutang, rateCalc, tenor).toLocaleString('id-ID');
            let kategori = rateSelect.options[rateSelect.selectedIndex].text;

            let teks = `*SIMULASI ANGSURAN DANASTRA*%0A------------------------------------%0A*Pinjaman:* Rp${pinjamanMurni.toLocaleString('id-ID')}%0A*Tenor:* ${tenor} Bulan%0A*Angsuran:* Rp${angsuran}%0A*Kategori:* ${kategori}%0A------------------------------------%0A_Syarat: KTP, STNK & BPKB Aman._%0A_Proses Cepat 30 Menit Cair!_%0A%0A*Hubungi Marketing Kami:*%0Awa.me/6287762804824`;
            
            window.open(`https://wa.me/?text=${teks}`, '_blank');
        }

        input.addEventListener('input', hitung);
        window.onload = hitung;
    </script>
</body>
</html>
